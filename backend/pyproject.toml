[project]
name = "agent-template"
version = "0.1.0"
description = "A chat on the Claude Agent SDK"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk",
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
